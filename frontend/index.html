<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japanese Reader</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="window">
    <header class="titlebar">
      <span class="titlebar__title">Japanese Reader v0.1</span>
    </header>

    <nav class="toolbar">
      <button class="btn" id="new-document" type="button">New</button>
      <button class="btn" id="open-image" type="button" title="Adds the page at the cursor">Open Image…</button>
      <input id="image-input" type="file" accept="image/*,.heic,.heif" hidden>
      <button class="btn" id="ai-chat" type="button" title="Show the AI chat window">AI Chat</button>
    </nav>

    <main class="workspace">
      <article class="page" id="document" lang="ja"
               data-placeholder="Open an image to begin."></article>
    </main>

    <footer class="statusbar">
      <span id="status-message">Ready</span>
      <span id="status-count">0 chars</span>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
