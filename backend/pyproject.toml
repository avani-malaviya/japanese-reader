[project]
name = "japanese-reader"
version = "0.1.0"
description = "Read Japanese pages with assistance: OCR, readings, furigana, meanings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=13.0.0",
    "mokuro>=0.2.5",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "jamdict>=0.1a11.post2",
    "jamdict-data>=1.5",
    "pillow-heif>=1.8.1",
    "doclayout-yolo>=0.0.4",
    "huggingface-hub>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
