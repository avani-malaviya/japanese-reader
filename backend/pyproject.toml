[project]
name = "japanese-reader"
version = "0.1.0"
description = "Read Japanese pages with assistance: OCR, readings, furigana, meanings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=13.0.0",
    "mokuro>=0.2.5",
    "fugashi>=1.5.2",
    "unidic-lite>=1.0.8",
    "jamdict>=0.1a11.post2",
    "jamdict-data>=1.5",
    "pillow-heif>=1.8.1",
    "doclayout-yolo>=0.0.4",
    "huggingface-hub>=2.3.0",
    "pydantic-settings>=2.6",
    # Pulled in by mokuro and doclayout-yolo; listed so Linux can take the CPU-only builds.
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.uv]
package = false

# On Linux (the container) torch comes without CUDA: the Space has no GPU, and the CUDA
# libraries would add several GB to the image. macOS keeps the default build (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
