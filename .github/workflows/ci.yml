name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Lint and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  image:
    name: Build the image and smoke-test it
    needs: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t japanese-reader .
      - run: docker run -d --name app -p 8000:7860 japanese-reader
      - run: scripts/smoke.sh http://localhost:8000
      - if: failure()
        run: docker logs app
